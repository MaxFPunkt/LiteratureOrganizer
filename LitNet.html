<script>
/* ==== src/js/01-bib.js ==== */

"use strict";
/* ============================ BibLaTeX parser ============================ */
function stripBraces(s){
  if(s==null) return "";
  s=String(s);
  s=s.replace(/\\['`^"~=.]\{?(\w)\}?/g,"$1")
     .replace(/\{\\(?:ss)\}/g,"ss").replace(/\\&/g,"&").replace(/\\%/g,"%")
     .replace(/\\\$/g,"$").replace(/\\_/g,"_").replace(/~/g," ")
     .replace(/\\(?:textbf|textit|emph|mathrm|text)\b/g,"");
  s=s.replace(/[{}]/g,"");
  return s.replace(/\s+/g," ").trim();
}
function parseBib(str){
  const entries=[]; let i=0; const n=str.length;
  function skipWs(){ while(i<n && /\s/.test(str[i])) i++; }
  while(i<n){
    while(i<n && str[i]!=='@') i++;
    if(i>=n) break;
    i++;
    let type=""; while(i<n && /[A-Za-z]/.test(str[i])) type+=str[i++];
    type=type.toLowerCase();
    skipWs();
    if(str[i]!=='{'){ continue; }
    i++;
    if(type==='comment'||type==='preamble'||type==='string'){
      let d=1; while(i<n&&d>0){ if(str[i]==='{')d++; else if(str[i]==='}')d--; i++; }
      continue;
    }
    let key=""; while(i<n && str[i]!==',' && str[i]!=='}') key+=str[i++];
    key=key.trim();
    const fields={};
    while(i<n && str[i]!=='}'){
      if(str[i]===','){ i++; continue; }
      skipWs();
      if(str[i]==='}') break;
      let name=""; while(i<n && /[A-Za-z0-9_+\-]/.test(str[i])) name+=str[i++];
      name=name.toLowerCase().trim();
      skipWs();
      if(str[i]!=='='){ while(i<n && str[i]!=='}') i++; break; }
      i++; skipWs();
      let val="";
      if(str[i]==='{'){
        let d=1; i++;
        while(i<n&&d>0){ const c=str[i]; if(c==='{')d++; else if(c==='}'){d--; if(d===0){i++;break;}} val+=c; i++; }
      } else if(str[i]==='"'){
        i++; let d=0;
        while(i<n){ const c=str[i]; if(c==='{')d++; else if(c==='}')d--; else if(c==='"'&&d===0){i++;break;} val+=c; i++; }
      } else {
        while(i<n && str[i]!==',' && str[i]!=='}') val+=str[i++];
      }
      if(name) fields[name]=val.trim();
    }
    if(str[i]==='}') i++;
    if(key) entries.push({type,key,fields});
  }
  return entries;
}
function authorsFromBib(raw){
  if(!raw) return "";
  return raw.split(/\s+and\s+/i).map(a=>{
    a=stripBraces(a);
    if(a.includes(",")){ const p=a.split(","); return (p[1]||"").trim()+" "+(p[0]||"").trim(); }
    return a;
  }).join(", ").trim();
}
function entryToPaper(e){
  const f=e.fields;
  return {
    key:e.key,
    title:stripBraces(f.title||f.booktitle||"Untitled"),
    authors:authorsFromBib(f.author||f.editor||""),
    year:stripBraces(f.year||f.date||"").slice(0,4),
    venue:stripBraces(f.journal||f.journaltitle||f.booktitle||f.publisher||f.eprinttype||""),
    doi:stripBraces(f.doi||f.url||(f.eprint?("arXiv:"+f.eprint):"")),
    abstract:stripBraces(f.abstract||""),
    note:""
  };
}
function bibAuthors(a){ if(!a) return "";
  return a.split(",").map(s=>{ s=s.trim(); if(!s) return ""; const i=s.lastIndexOf(" ");
    return i<0? s : (s.slice(i+1)+", "+s.slice(0,i)); }).filter(Boolean).join(" and "); }
function bibField(name,val){ if(!val) return ""; return `,\n  ${name} = {${String(val).replace(/[{}]/g,"")}}`; }
function bibKey(p,used){ let k=(p.key||"").trim();
  if(!k){ const last=((p.authors||"anon").split(",")[0].trim().split(" ").pop())||"anon"; k=(last+(p.year||"")).replace(/[^A-Za-z0-9]/g,"")||"ref"; }
  let base=k,n=2; while(used.has(k)){ k=base+"_"+(n++); } used.add(k); return k; }
function toBib(){ const used=new Set();
  return state.papers.map(p=>{ const k=bibKey(p,used);
    const v=(p.venue||""); const type= /arxiv|preprint/i.test(v)?"misc": (/(proc|conf|symp|workshop|meeting)/i.test(v)?"inproceedings":"article");
    let s=`@${type}{${k}`;
    s+=bibField("title",p.title);
    s+=bibField("author",bibAuthors(p.authors));
    s+=bibField("year",p.year);
    s+= (type==="inproceedings") ? bibField("booktitle",v) : (type==="article"? bibField("journal",v) : bibField("howpublished",v));
    if(/^10\./.test(p.doi||"")) s+=bibField("doi",p.doi);
    else if(/^https?:/i.test(p.doi||"")) s+=bibField("url",p.doi);
    else if(/^arxiv:/i.test(p.doi||"")){ s+=bibField("eprint",p.doi.replace(/^arxiv:/i,"")); s+=bibField("eprinttype","arxiv"); }
    s+=bibField("note",p.note);
    s+="\n}"; return s; }).join("\n\n")+"\n"; }


/* ==== src/js/02-state.js ==== */
/* ============================ State ============================ */
const KEY="litnet.v2";
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
let state={papers:[], edges:[]};
let bookmarks=[];
let showLabels=false;
let lastLayout="radial";
let globalShape="card";
let bundleStrength=0.85;
let heb=null, hebPos=null;
let fileHandle=null, currentFileName=null;
const hasFSA = (typeof window!=="undefined") && ('showOpenFilePicker' in window);
let selId=null, selEdge=null, hoverId=null, hoverEdge=null;
let selSet=new Set(), focusId=null, colorByTag=false;
let snapOn=true;
let legendNames={}, colorFilter=null;
let linkMode=false, linkFirst=null, searchQ="", shiftDown=false;
let uid=1;
const PALETTE=["#6C8CFF","#FF8A5B","#34C7A0","#B57BFF","#FFC247","#FF6B9D","#3FB6E6","#9CCB3B","#FF7A7A"];
function nextId(){ return "p"+(uid++); }
function inkFor(c){
  if(!/^#[0-9a-fA-F]{6}$/.test(c||"")) return "#ffffff";
  const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)>150? "#232a40" : "#ffffff";
}
function colorFor(p){
  if(p.color) return p.color;
  let h=0, s=(colorByTag && p.tags && p.tags[0])? "tag:"+p.tags[0].toLowerCase() : (p.id||p.key||p.title||"x");
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return PALETTE[h%PALETTE.length];
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); state.papers=d.papers||[]; state.edges=d.edges||[];
      bookmarks=d.bookmarks||[]; showLabels=!!d.showLabels; lastLayout=d.lastLayout||"radial";
      if(d.globalShape) globalShape=d.globalShape; if(typeof d.bundleStrength==="number") bundleStrength=d.bundleStrength;
      if(typeof d.colorByTag==="boolean") colorByTag=d.colorByTag;
      if(typeof d.snapOn==="boolean") snapOn=d.snapOn;
      if(d.legendNames && typeof d.legendNames==="object") legendNames=d.legendNames;
      uid=d.uid|| (state.papers.reduce((m,p)=>Math.max(m,parseInt((p.id||"p0").slice(1))||0),0)+1);
    }
  }catch(e){ console.warn("load failed",e); }
}
function persistObj(){ return {papers:state.papers,edges:state.edges,uid,bookmarks,showLabels,lastLayout,globalShape,bundleStrength,colorByTag,snapOn,legendNames}; }
let saveTimer=null, dirty=false;
function markDirty(){ dirty=true; updateDirty(); }
function markClean(){ dirty=false; updateDirty(); }
function updateDirty(){ const b=document.getElementById("btnSave"); if(b) b.classList.toggle("dirty",dirty); }
function save(){
  markDirty();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(KEY,JSON.stringify(persistObj())); flashSaved(); }
    catch(e){ console.warn("save failed",e); }
  },300);
}

function findEdge(from,to){ return state.edges.find(e=>e.from===from&&e.to===to); }

function hasEdge(a,b){ return state.edges.some(e=>e.from===a&&e.to===b); }

/* ============================ Search ============================ */

  const s=new Set([focusId]); let frontier=[focusId];

      if(e.to===id&&!s.has(e.from)){s.add(e.from);next.push(e.from);} } }

}
function computeLit(){

    return lit; }

  if(q.startsWith("#")){ const t=q.slice(1).trim(); if(!t) return null;
    for(const p of state.papers){ if((p.tags||[]).some(x=>x.toLowerCase().startsWith(t))) lit.add(p.id); }

function nodeAt(sx,sy){
  for(let i=state.papers.length-1;i>=0;i--){ const p=state.papers[i]; const [cx,cy]=w2s(p.x,p.y);
    if(effShape(p)==="dot"){ const r=dotR(p)*view.scale+2; if((sx-cx)**2+(sy-cy)**2<=r*r) return p; }
    else { const hw=CARDW/2*heroScale(p)*view.scale, hh=CARDH/2*heroScale(p)*view.scale; if(Math.abs(sx-cx)<=hw && Math.abs(sy-cy)<=hh) return p; } }
  return null;
}
function edgeAt(sx,sy){
  hebPos = bundlingActive()? hebNodePositions() : null;
  let best=null, bd=12;
  const segd=(px,py,ax,ay,bx,by)=>{
    const dx=bx-ax, dy=by-ay; const L2=dx*dx+dy*dy;
    let t= L2? ((px-ax)*dx+(py-ay)*dy)/L2 : 0; t=Math.max(0,Math.min(1,t));
    return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));

    for(let i=1;i<pts.length;i++){
      const d=segd(sx,sy,pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]);
      if(d<bd){ bd=d; best=e; } } }
  return best;
}

/* ============================ Layout algorithms ============================ */
function finalizeLayout(){ save(); fit(); requestDraw(); }
function layoutRadial(){
  if(!state.papers.length) return;

  const ids=state.papers.map(p=>p.id);
  const adj={}, outDeg={};
  ids.forEach(id=>{ adj[id]=new Set(); outDeg[id]=0; });
  for(const e of state.edges){ if(adj[e.from]&&adj[e.to]){ adj[e.from].add(e.to); adj[e.to].add(e.from); outDeg[e.from]++; } }
  let center=ids[0];
  for(const id of ids){ if(outDeg[id]>outDeg[center] || (outDeg[id]===outDeg[center] && adj[id].size>adj[center].size)) center=id; }
  const ring={}; ring[center]=0; const q=[center];
  while(q.length){ const u=q.shift(); for(const v of adj[u]){ if(ring[v]==null){ ring[v]=ring[u]+1; q.push(v); } } }
  let maxR=0; ids.forEach(id=>{ if(ring[id]!=null) maxR=Math.max(maxR,ring[id]); });
  const discon=ids.filter(id=>ring[id]==null);
  if(discon.length){ maxR++; discon.forEach(id=>ring[id]=maxR); }
  const rings=[]; for(let r=0;r<=maxR;r++) rings[r]=[];
  ids.forEach(id=>rings[ring[id]].push(id));

  for(let r=0;r<=maxR;r++){ const c=rings[r].length; const need=c>1? (c*minArc)/(2*Math.PI):0; radius[r]= r===0?0: Math.max(r*ringGap, need); }
  const ang={}, bc={};
  for(let r=1;r<=maxR;r++){ const arr=rings[r]; arr.forEach((id,i)=>ang[id]=(i/arr.length)*2*Math.PI); }
  const cmean=list=>{ let sx=0,sy=0,n=0; for(const a of list){ sx+=Math.cos(a); sy+=Math.sin(a); n++; } return n? Math.atan2(sy,sx):null; };
  for(let pass=0;pass<6;pass++){
    const inward=(pass%2===0);
    const seq=[]; for(let k=1;k<=maxR;k++) seq.push(inward? k : maxR-k+1);
    for(const r of seq){ const arr=rings[r]; if(arr.length<=1) continue;
      const ref= inward? r-1 : r+1;
      arr.forEach(id=>{ const nb=[...adj[id]].filter(v=>ring[v]===ref).map(v=>ang[v]); const m=cmean(nb); bc[id]= m!=null? m : ang[id]; });
      arr.sort((a,b)=>bc[a]-bc[b]);
      const center0=cmean(arr.map(id=>bc[id]))||0; const step=2*Math.PI/arr.length;
      arr.forEach((id,i)=>{ ang[id]= center0 + (i-(arr.length-1)/2)*step; });
    }
  }

  for(let r=1;r<=maxR;r++){ for(const id of rings[r]){ const p=byId(id); p.x=radius[r]*Math.cos(ang[id]); p.y=radius[r]*Math.sin(ang[id]); } }
  finalizeLayout();
}
function layoutLayered(){
  if(!state.papers.length) return; pushUndo();
  const layer={}, visiting={};
  function L(id){ if(layer[id]!=null) return layer[id]; if(visiting[id]) return 0; visiting[id]=true;
    let mx=-1; for(const e of state.edges){ if(e.from===id) mx=Math.max(mx,L(e.to)); } visiting[id]=false; return layer[id]=mx+1; }
  state.papers.forEach(p=>L(p.id));
  const layers={}; let maxL=0;
  state.papers.forEach(p=>{ const l=layer[p.id]; (layers[l]=layers[l]||[]).push(p); maxL=Math.max(maxL,l); });
  for(let pass=0;pass<4;pass++){
    for(let l=1;l<=maxL;l++){ const arr=layers[l]; if(!arr) continue;
      const pos={}; (layers[l-1]||[]).forEach((p,idx)=>pos[p.id]=idx);
      arr.forEach(p=>{ const nb=state.edges.filter(e=>e.from===p.id&&pos[e.to]!=null).map(e=>pos[e.to]); p._bc= nb.length? nb.reduce((a,b)=>a+b,0)/nb.length : 1e9; });
      arr.sort((a,b)=>a._bc-b._bc);

function layoutCircle(){
  if(!state.papers.length) return; pushUndo();
  const ids=state.papers.map(p=>p.id); const n=ids.length;
  const adj={}; ids.forEach(id=>adj[id]=new Set());
  for(const e of state.edges){ if(adj[e.from]&&adj[e.to]){ adj[e.from].add(e.to); adj[e.to].add(e.from); } }
  const ang={}; ids.forEach((id,i)=>ang[id]=(i/n)*2*Math.PI);
  const cmean=list=>{ let sx=0,sy=0,k=0; for(const a of list){ sx+=Math.cos(a); sy+=Math.sin(a); k++; } return k? Math.atan2(sy,sx):null; };
  for(let pass=0;pass<24;pass++){
    const bc={}; ids.forEach(id=>{ const nb=[...adj[id]].map(v=>ang[v]); const m=cmean(nb); bc[id]= m!=null? m : ang[id]; });
    const order=[...ids].sort((a,b)=>bc[a]-bc[b]);
    order.forEach((id,i)=>ang[id]=(i/n)*2*Math.PI);
  }
  const minArc=210, R=Math.max(260,(n*minArc)/(2*Math.PI));
  ids.forEach(id=>{ const p=byId(id); p.x=R*Math.cos(ang[id]); p.y=R*Math.sin(ang[id]); });
  const ord=[...ids].sort((a,b)=>ang[a]-ang[b]);
  heb=buildHEB(ord);
  finalizeLayout();
}
function layoutGrid(){
  if(!state.papers.length) return; pushUndo();
  const arr=[...state.papers].sort((a,b)=> (inDegree(b.id)-inDegree(a.id)) || String(b.year).localeCompare(String(a.year)));
  const n=arr.length, cols=Math.max(1,Math.ceil(Math.sqrt(n))), rows=Math.ceil(n/cols); const gx=230, gy=130;
  arr.forEach((p,i)=>{ const r=Math.floor(i/cols), c=i%cols; p.x=c*gx-(cols-1)*gx/2; p.y=r*gy-(rows-1)*gy/2; });
  finalizeLayout();
}
function layoutForce(){
  if(!state.papers.length) return; pushUndo();
  const P=state.papers, N=P.length;
  P.forEach(p=>{ p.x=(Math.random()-.5)*Math.max(600,N*20); p.y=(Math.random()-.5)*Math.max(400,N*16); p.vx=0; p.vy=0; });
  const rep=42000, spring=0.02, rest=200, damp=0.85, iters= N>250?150:300;
  for(let it=0; it<iters; it++){
    for(let i=0;i<N;i++){ const p=P[i]; let fx=0,fy=0;
      for(let j=0;j<N;j++){ if(i===j) continue; const qd=P[j];
        let dx=p.x-qd.x, dy=p.y-qd.y; let d2=dx*dx+dy*dy; if(d2<1){ d2=1; dx=Math.random(); dy=Math.random(); }
        const d=Math.sqrt(d2), f=rep/d2; fx+=dx/d*f; fy+=dy/d*f; }
      fx-=p.x*0.02; fy-=p.y*0.02; p._fx=fx; p._fy=fy; }
    for(const e of state.edges){ const p=byId(e.from), qd=byId(e.to); if(!p||!qd) continue;
      let dx=qd.x-p.x, dy=qd.y-p.y; const d=Math.hypot(dx,dy)||1; const f=spring*(d-rest);
      p._fx+=dx/d*f; p._fy+=dy/d*f; qd._fx-=dx/d*f; qd._fy-=dy/d*f; }
    for(let i=0;i<N;i++){ const p=P[i]; p.vx=(p.vx+p._fx*0.05)*damp; p.vy=(p.vy+p._fy*0.05)*damp; p.x+=p.vx; p.y+=p.vy; }
  }
  P.forEach(p=>{ delete p.vx; delete p.vy; delete p._fx; delete p._fy; });
  finalizeLayout();
}
function layoutTimeline(){
  if(!state.papers.length) return; pushUndo();
  const yr=p=>{ const m=String(p.year||"").match(/\d{4}/); return m? +m[0] : null; };
  const groups=new Map();
  for(const p of state.papers){ const y=yr(p); const k=(y==null)?"?":y;
    if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(p); }
  const keys=[...groups.keys()].sort((a,b)=>{
    if(a==="?") return 1; if(b==="?") return -1; return a-b; });
  const gx=CARDW+80, gy=CARDH+42;
  keys.forEach((k,ci)=>{
    const col=groups.get(k).sort((a,b)=>inDegree(b.id)-inDegree(a.id));
    col.forEach((p,ri)=>{ p.x=ci*gx-(keys.length-1)*gx/2; p.y=ri*gy-(col.length-1)*gy/2; });
  });
  finalizeLayout();
}

function fit(){
  if(!state.papers.length){ view={x:0,y:0,scale:1}; return; }
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const p of state.papers){ minx=Math.min(minx,p.x); maxx=Math.max(maxx,p.x); miny=Math.min(miny,p.y); maxy=Math.max(maxy,p.y); }
  const padW=CARDW+80, padH=CARDH+80; const gw=(maxx-minx)+padW, gh=(maxy-miny)+padH;
  view.scale=Math.min(1.4, Math.max(0.12, Math.min(W/gw, H/gh)));
  const cx=(minx+maxx)/2, cy=(miny+maxy)/2; view.x=-cx*view.scale; view.y=-cy*view.scale;
  requestDraw();
}

function isTyping(e){ const t=(e.target.tagName||""); return t==="INPUT"||t==="TEXTAREA"; }
window.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ saveCurrent(); e.preventDefault(); return; }
  if(e.key==="Shift" && !shiftDown){ shiftDown=true; setLinkBtn(); updateHint(); }
  if(e.key==="Escape"){ layoutMenu.classList.remove("open"); exportMenu.classList.remove("open"); infoPop.classList.remove("open"); addMenu.classList.remove("open");
    if(colorFilter){ colorFilter=null; if(legendPop.classList.contains("open")) renderLegend(); requestDraw(); } if(linkFirst){linkFirst=null;updateHint();requestDraw();} else if(linkMode) toggleLink(false); closeAllModals(); hideTip();
    if(focusId){ focusId=null; renderSide(); requestDraw(); }
    if(selSet.size){ selSet.clear(); renderSide(); requestDraw(); }
    if(!isTyping(e) && isNarrow()) panelHide(); }
  if(isTyping(e)) return;
  if((e.key==="Delete"||e.key==="Backspace")){
    if(selSet.size){ pushUndo(); [...selSet].forEach(id=>deletePaper(id)); selSet.clear();
      save(); renderSide(); updateStats(); requestDraw(); e.preventDefault(); }
    else if(selId){ pushUndo(); deletePaper(selId); save(); renderSide(); updateStats(); requestDraw(); e.preventDefault(); }
    else if(selEdge){ pushUndo(); removeEdge(selEdge.from,selEdge.to); selEdge=null; save(); renderSide(); updateStats(); requestDraw(); e.preventDefault(); }
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !e.shiftKey){ undo(); e.preventDefault(); }
  if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==="y" || (e.shiftKey && e.key.toLowerCase()==="z"))){ redo(); e.preventDefault(); }
  if(e.key.toLowerCase()==="l"){ toggleLink(); }
  if(e.key.toLowerCase()==="a" && !(e.ctrlKey||e.metaKey)){ arrange(); }
  if(e.key.toLowerCase()==="f"){ fit(); }
  if(e.key.toLowerCase()==="t"){ showLabels=!showLabels; setLabelsBtn(); save(); requestDraw(); }
});

document.getElementById("bibDo").onclick=()=>{
  const entries=parseBib(document.getElementById("bibText").value);
  if(!entries.length){ toast("No BibLaTeX entries found — paste text starting with @article{…"); return; }
  pushUndo();
  const keys=new Set(state.papers.map(p=>p.key).filter(Boolean));
  const dois=new Set(state.papers.map(p=>normDoi(p.doi)).filter(Boolean));
  let added=0,skipped=0; const fresh=[];
  for(const e of entries){
    const cand=entryToPaper(e), nd=normDoi(cand.doi);
    if((e.key && keys.has(e.key)) || (nd && dois.has(nd))){ skipped++; continue; }
    const np=addPaper(cand); fresh.push(np);
    if(e.key) keys.add(e.key); if(nd) dois.add(nd); added++;
  }
  placeNewInCorner(fresh);
  save(); updateStats(); updateHint(); closeModal("bibModal");
  toast(`Added ${added} paper${added===1?"":"s"}${skipped?` · skipped ${skipped} duplicate${skipped===1?"":"s"}`:""}`);

function placeNewInCorner(fresh){
  if(!fresh.length) return;
  const stepX=CARDW+40, stepY=CARDH+34;
  const corner=s2w(50,50);
  const cols=Math.max(1, Math.floor((W-100)/(stepX*view.scale)));
  const existing=state.papers.filter(p=>fresh.indexOf(p)<0);
  const occ=(x,y)=> existing.some(p=>Math.abs(p.x-x)<stepX*0.85 && Math.abs(p.y-y)<stepY*0.85);
  let cell=0;
  for(const p of fresh){ let x,y;
    do{ const c=cell%cols, r=Math.floor(cell/cols); x=corner[0]+c*stepX; y=corner[1]+r*stepY; cell++; } while(occ(x,y) && cell<5000);
    p.x=x; p.y=y; }
}

  document.getElementById("pYear").value=p?p.year:""; document.getElementById("pVenue").value=p?p.venue:"";
  document.getElementById("pDoi").value=p?p.doi:""; document.getElementById("pNote").value=p?p.note:"";

  else { const p=addPaper(Object.assign({key:"",abstract:""},data)); selId=p.id; selEdge=null; const c=s2w(W/2,H/2); p.x=c[0]; p.y=c[1]; }
  save(); renderSide(); updateStats(); updateHint(); closeModal("paperModal"); requestDraw(); };

/* ============================ Open / Save / Export ============================ */
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),1900); }
function downloadBlob(text,name,type){ const blob=new Blob([text],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function downloadBib(){ if(!state.papers.length){ toast("No papers to export"); return; }
  downloadBlob(toBib(),(currentFileName? currentFileName.replace(/\.json$/i,""):"litnet-"+new Date().toISOString().slice(0,10))+".bib","text/plain"); toast("BibLaTeX file downloaded"); }
function copyBib(){ if(!state.papers.length){ toast("No papers to export"); return; } const text=toBib();
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>toast("BibLaTeX copied to clipboard")).catch(()=>fallbackCopy(text)); }
  else fallbackCopy(text); }
function fallbackCopy(text){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("BibLaTeX copied to clipboard"); }catch(e){ toast("Copy failed — use BibLaTeX → file"); } document.body.removeChild(ta); }

function applyJSON(d, replace){
  if(!d || !d.papers) throw new Error("bad json");
  pushUndo();
  if(replace){
    state.papers=d.papers; state.edges=(d.edges||[]).map(e=>Object.assign({label:"",pin:false},e)); uid=d.uid||1;
    bookmarks=d.bookmarks||[]; if(typeof d.showLabels==="boolean") showLabels=d.showLabels;
    if(d.globalShape) globalShape=d.globalShape; if(typeof d.bundleStrength==="number") bundleStrength=d.bundleStrength;
    if(typeof d.colorByTag==="boolean") colorByTag=d.colorByTag;
    if(typeof d.snapOn==="boolean") snapOn=d.snapOn;
    if(d.legendNames && typeof d.legendNames==="object") legendNames=d.legendNames;
    if(d.lastLayout) lastLayout=d.lastLayout;
  } else {
    const map={}; for(const p of d.papers){ const np=Object.assign({},p); const old=np.id; np.id=nextId(); map[old]=np.id; state.papers.push(np); }
    for(const e of (d.edges||[])){ if(map[e.from]&&map[e.to]){ state.edges.push({from:map[e.from],to:map[e.to],label:e.label||"",pin:!!e.pin}); } }
  }
  selId=null; selEdge=null; selSet.clear(); focusId=null; heb=null; setLabelsBtn(); setShapeBtn(); save(); renderSide(); updateStats(); updateHint();
  if(lastLayout==="circle" && state.papers.length) heb=buildHEB(currentCircularOrder());
  fit();
}
async function openFile(){

      if(state.papers.length){

    catch(err){ console.warn(err); toast("Could not read that file"); }

document.getElementById("fileIn").onchange=function(){
  const f=this.files[0]; if(!f) return; const rd=new FileReader();

async function saveToHandle(){
  try{
    if(fileHandle.queryPermission){ let perm=await fileHandle.queryPermission({mode:"readwrite"});
      if(perm!=="granted"){ perm=await fileHandle.requestPermission({mode:"readwrite"}); if(perm!=="granted"){ toast("Write permission denied"); return; } } }
    const w=await fileHandle.createWritable(); await w.write(JSON.stringify(persistObj(),null,2)); await w.close();
    markClean(); toast("Saved to "+currentFileName);
  }catch(err){ console.warn(err); toast("Save failed — try Save As"); }

async function saveAs(){

        types:[{description:"LitNet JSON",accept:{"application/json":[".json"]}}] });
      fileHandle=h; currentFileName=h.name; updateFileName(); await saveToHandle(); }
    catch(err){ if(err && err.name!=="AbortError"){ console.warn(err); } }
  } else { downloadBlob(JSON.stringify(persistObj(),null,2),"litnet-"+new Date().toISOString().slice(0,10)+".json","application/json"); markClean(); toast("Backup downloaded"); }
}
function draftMarkdown(){
  const used=new Set();
  const groups=new Map();
  for(const p of state.papers){ const t=(p.tags&&p.tags[0])||"Ungrouped";
    if(!groups.has(t)) groups.set(t,[]); groups.get(t).push(p); }
  let md="# Related Work (draft)\n\n_Generated by LitNet on "+new Date().toISOString().slice(0,10)+". Group order = tag; \\cite keys match the BibLaTeX export._\n";
  for(const [t,ps] of [...groups.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0])))){
    md+="\n## "+t+"\n\n";
    ps.sort((a,b)=>String(a.year).localeCompare(String(b.year)));
    for(const p of ps){
      md+="- **"+p.title+"** ("+(p.authors||"—")+(p.year?", "+p.year:"")+") \\cite{"+bibKey(p,used)+"}";
      if(p.note&&p.note.trim()) md+=" — "+p.note.trim().replace(/\s*\n+\s*/g," ");
      md+="\n";
      for(const e of state.edges.filter(e=>e.from===p.id&&e.label)){
        const o=byId(e.to); if(o) md+="  - "+e.label+" → *"+o.title+"*\n"; }
    }
  }
  return md;
}

/* ============================ OpenAlex (auto-link & metadata) ============================ */
const OA="https://api.openalex.org", OA_MAILTO="mailto=litnet-app@proton.me";
function realDoi(v){
  const d=normDoi(v);
  if(/^10\./.test(d)) return d;
  const m=String(v||"").match(/arxiv:\s*([0-9]{4}\.[0-9]{4,5})(v\d+)?/i);
  return m? "10.48550/arxiv."+m[1] : null;
}
function oaMatchRefs(results,cand){
  // returns {byOaId: Map(openalexId -> paper), refs: Map(paperId -> [openalexIds])}
  const byOaId=new Map(), refs=new Map();
  for(const w of results){ const nd=normDoi(w.doi);
    const hit=cand.find(x=>x.doi===nd);
    if(hit){ byOaId.set(w.id,hit.p); refs.set(hit.p.id,w.referenced_works||[]); } }
  return {byOaId,refs};
}
function oaCountLinks(byOaId,refs){
  const links=[];
  for(const [pid,rw] of refs){ for(const r of rw){
    const t=byOaId.get(r); if(t && t.id!==pid && !hasEdge(pid,t.id)) links.push([pid,t.id]); } }
  return links;
}
async function runAutoLink(){
  const cand=state.papers.map(p=>({p,doi:realDoi(p.doi)})).filter(x=>x.doi);
  if(cand.length<2){ toast("Need at least 2 papers with DOIs or arXiv IDs"); return; }
  toast(`Looking up ${cand.length} papers on OpenAlex…`);
  try{
    let allResults=[];
    for(let i=0;i<cand.length;i+=40){
      const batch=cand.slice(i,i+40);
      const url=`${OA}/works?filter=doi:${batch.map(x=>x.doi).join("|")}&select=id,doi,referenced_works&per-page=50&${OA_MAILTO}`;
      const res=await fetch(url);
      if(!res.ok) throw new Error("HTTP "+res.status);
      allResults=allResults.concat((await res.json()).results||[]);
    }
    const {byOaId,refs}=oaMatchRefs(allResults,cand);
    const links=oaCountLinks(byOaId,refs);
    if(!links.length){ toast(`No new links found (${byOaId.size}/${cand.length} papers matched on OpenAlex)`); return; }
    pushUndo();
    let n=0; for(const [a,b] of links){ if(addEdge(a,b)) n++; }
    save(); updateStats(); renderSide(); requestDraw();
    toast(`Auto-link: added ${n} citation link${n===1?"":"s"} (${byOaId.size}/${cand.length} papers matched)`);
  }catch(err){ console.warn(err); toast("OpenAlex lookup failed — check your connection and try again"); }
}
async function fetchDoiMeta(){
  const doi=realDoi(document.getElementById("pDoi").value);
  if(!doi){ toast("Enter a DOI or arXiv ID first"); return; }
  const btn=document.getElementById("pFetch"); btn.disabled=true; btn.textContent="…";
  try{
    const res=await fetch(`${OA}/works/doi:${doi}?${OA_MAILTO}`);
    if(!res.ok){ toast("Not found on OpenAlex"); return; }
    const w=await res.json();
    const fill=(id,v)=>{ const el=document.getElementById(id); if(v && !el.value.trim()) el.value=v; };
    fill("pTitle", w.title||"");
    fill("pAuthors",(w.authorships||[]).map(a=>a.author&&a.author.display_name).filter(Boolean).join(", "));
    fill("pYear", w.publication_year? String(w.publication_year):"");
    fill("pVenue", (w.primary_location&&w.primary_location.source&&w.primary_location.source.display_name)||"");
    toast("Metadata filled from OpenAlex (empty fields only)");
  }catch(err){ console.warn(err); toast("Lookup failed — offline?"); }
  finally{ btn.disabled=false; btn.textContent="⤓ Fetch"; }
}
document.getElementById("pFetch").onclick=fetchDoiMeta;
